<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/8aa1dcd4e1.js" crossorigin="anonymous"></script>
</head>
<body>
<!-- Header section starts here -->
    <header>
        <img src="Image/BiteBoxLogo.png" alt="" width="180px">

        <nav>
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="biteDeals.html">BiteDeals</a>
        <a href="cart.html"><i class="fa-solid fa-cart-plus"></i></a>
        <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
        </nav>
    </header>
<!-- Header section ends here -->

<!-- Start cart section -->
 <section class="cart">
    <h2 style="text-align: center;">Your Cart</h2>
    <table>
        <thead>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </thead>

        <tbody>
            <tr>
                <td class="item">
                    <img src="image/burger-card1.png" alt="Cheese Burger">
                    <div>
                        <h4>Cheese Burger</h4>
                        <p>Juicy Grilled Burger</p>
                    </div>
                </td>

                <td>₹199</td>

                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>

                <td>₹199</td>

                <td><button class="remove">❌</button></td>
            </tr>

            <tr>
                <td class="item">
                    <img src="image/pizza-card2.png" alt="Capsicum Pizza">
                    <div>
                        <h4>Capsicum Pizza</h4>
                        <p>Loaded with cheese</p>
                    </div>
                </td>

                <td>₹249</td>

                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>

                <td>₹249</td>

                <td><button class="remove">❌</button></td>
            </tr>

            <tr>
                <td class="item">
                    <img src="image/alfredo-card4.png" alt="Alfredo Pasta">
                    <div>
                        <h4>Alfredo Pasta</h4>
                        <p>Creamy white sauce</p>
                    </div>
                </td>

                <td>₹229</td>

                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>

                <td>₹229</td>

                <td><button class="remove">❌</button></td>
            </tr>

            <tr class="grand-total">
                <td colspan="3">Grand Total</td>

                <td>₹797</td>
                
                <td><button>Proceed</button></td>
            </tr>

        </tbody>
    </table>

 </section>

</body>
</html>
